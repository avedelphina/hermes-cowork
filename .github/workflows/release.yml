name: Release

# Tag a release commit `vX.Y.Z` (matching package.json) and push the tag:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds, signs (Developer ID), notarises, and publishes a draft GitHub
# release with the DMG. Review the draft, then publish it.
#
# Required repository secrets:
#   CSC_LINK                     base64 of the "Developer ID Application" .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
#   APPLE_TEAM_ID                10-char Apple Developer Team ID

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Build, sign, notarise, publish draft
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish always --config.mac.notarize=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature + notarisation
        working-directory: apps/desktop
        run: |
          app="release/mac-arm64/Hermes Cowork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vvv -t install "$app"
