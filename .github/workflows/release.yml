name: Release

# Tag a commit on main `vX.Y.Z` (matching package.json) and push the tag:
#   git tag v0.2.0 && git push origin v0.2.0
# This checks the tag, builds + signs + notarises the macOS DMG/zip and builds
# the Linux AppImage, and — only when both succeed — publishes the GitHub
# release. Nothing goes live if either platform fails.
#
# Required repository secrets (macOS signing):
#   CSC_LINK                     base64 of the "Developer ID Application" .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for notarytool
#   APPLE_TEAM_ID                10-char Apple Developer Team ID

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main and matches package.json
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main — merge first, then tag"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json apps/desktop/package.json; do
            pkg="$(node -p "require('./$f').version")"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $f version $pkg"
              exit 1
            fi
          done

      - uses: ./.github/actions/setup
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

      # The platform jobs upload into this draft; electron-builder reuses an
      # existing release for the tag. Creating it once here avoids the two
      # jobs racing to create it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "Hermes Cowork $GITHUB_REF_NAME" --generate-notes

  release-mac:
    runs-on: macos-14
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @hermes-cowork/desktop exec electron-vite build

      - name: Sign, notarise, upload
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --publish always --config.mac.notarize=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature + notarisation
        working-directory: apps/desktop
        run: |
          app="release/mac-arm64/Hermes Cowork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vvv -t install "$app"
          xcrun stapler validate "$app"

  release-linux:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @hermes-cowork/desktop exec electron-vite build
      - name: Build + upload AppImage
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [release-mac, release-linux]
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
