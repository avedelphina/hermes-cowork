name: CI

on:
  push:
    branches: [main, 'harden/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  # Packaging is only exercised when something that can break it changed
  # (macOS minutes are expensive). Pushes to main/harden always package.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" \
            | grep -qE '^(apps/desktop/(electron-builder\.yml|package\.json|build/)|pnpm-lock\.yaml|\.github/)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  # `--publish never`: electron-builder.yml sets `publish: github` for the tag
  # workflow (release.yml); without it electron-builder demands a GH_TOKEN.
  # Signing/notarisation only happen on release, so these are unsigned.
  package-mac:
    runs-on: macos-14
    needs: [check, changes]
    if: needs.changes.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @hermes-cowork/desktop exec electron-vite build
      - run: pnpm --filter @hermes-cowork/desktop exec electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-cowork-dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.packaging == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @hermes-cowork/desktop exec electron-vite build
      - run: pnpm --filter @hermes-cowork/desktop exec electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-cowork-appimage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error
