appId: com.hermescowork.desktop
productName: Hermes Cowork
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - "!node_modules/**/*"

# GitHub Releases. electron-builder generates latest-mac.yml + .blockmap here
# — the feed electron-updater reads (see src/main/update/updater.ts).
publish:
  provider: github
  owner: avedelphina
  repo: hermes-cowork

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Off by default so `pnpm build:mac` works with no Apple credentials.
  # The release workflow turns it on with --config.mac.notarize=true once
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are in the env.
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
    # zip is the artifact Squirrel.Mac (electron-updater) actually installs —
    # the DMG is for first-time manual install only.
    - target: zip
      arch: [arm64]

dmg:
  # background: build/dmg-background.png  # TODO: add DMG background
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
