<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="feather" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D4FF"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.34"/>
    </filter>
    <path id="wing" d="M-168,232 C-196,86 -150,-70 -30,-165 C60,-235 165,-210 212,-176
                       C122,-150 42,-95 -18,12 C-74,110 -120,188 -168,232 Z"/>
    <clipPath id="wingClip"><path d="M-168,232 C-196,86 -150,-70 -30,-165 C60,-235 165,-210 212,-176
                       C122,-150 42,-95 -18,12 C-74,110 -120,188 -168,232 Z"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>

  <g transform="translate(506 520) rotate(-8) scale(1.08)" filter="url(#soft)">
    <use href="#wing" fill="url(#feather)"/>
    <!-- gold leading-edge tip -->
    <path d="M-30,-165 C60,-235 165,-210 212,-176 C150,-162 96,-140 48,-104
             C40,-138 18,-158 -30,-165 Z" fill="#FBBF24"/>
    <!-- feather separations, clipped to the wing -->
    <g clip-path="url(#wingClip)" stroke="#7C3AED" stroke-width="16"
       stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M168,-140 C50,-110 -40,-24 -112,182"/>
      <path d="M104,-88 C18,-52 -58,34 -110,196"/>
      <path d="M40,-36 C-16,4 -74,84 -110,204"/>
    </g>
  </g>
</svg>
